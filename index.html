<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Programmer Simulator</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f5f7;color:#111827}main{max-width:760px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin:12px 0}.grid,.status,.remaining{display:grid;grid-template-columns:1fr 1fr;gap:10px}label,.small{font-size:13px;color:#667085}input{width:100%;font-size:17px;padding:10px;border:1px solid #d0d5dd;border-radius:9px;margin-top:4px}.buttons{display:flex;gap:9px;margin-top:14px}button{font-size:16px;padding:12px 17px;border:0;border-radius:10px;font-weight:600}#start{background:#111827;color:#fff}#pause{background:#e5e7eb}#reset{background:#fee2e2;color:#991b1b}.big{font-size:23px;font-weight:700}.remain{padding:11px;border-radius:11px;background:#f8fafc;border:1px solid #e5e7eb}.remain strong{display:block;font-size:18px;margin-top:3px}.active{border:2px solid #111827}.msg{color:#b42318;font-size:13px;min-height:18px;margin-top:7px}canvas{width:100%;height:210px;background:#fafafa;border-radius:10px}</style></head><body><main><h1>Programmer Simulator</h1><div class="small">Real-time heat treatment cycle — 1 second = 1 second.</div><section class="card"><div class="grid"><label>Start temperature (°C)<input id="startTemp" type="number" value="25"></label><label>Heating rate (°C/hr)<input id="heatRate" type="number" value="50"></label><label>Soak temperature (°C)<input id="soakTemp" type="number" value="600"></label><label>Hold duration (hr)<input id="holdHours" type="number" value="2" step=".1"></label><label>Cooling rate (°C/hr)<input id="coolRate" type="number" value="50"></label><label>Cool-to temperature (°C)<input id="endTemp" type="number" value="100"></label></div><div id="message" class="msg"></div><div class="buttons"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button></div></section><section class="card status"><div><div class="small">Current stage</div><div id="stage" class="big">Ready</div></div><div><div class="small">Temperature</div><div id="temperature" class="big">25.0 °C</div></div><div><div class="small">Elapsed</div><div id="elapsed" class="big">0h 00m 00s</div></div><div><div class="small">Total remaining</div><div id="totalRemaining" class="big">—</div></div></section><section class="card"><div class="small" style="margin-bottom:9px">STAGE TIME REMAINING</div><div class="remaining"><div id="riseBox" class="remain"><span class="small">Rise</span><strong id="riseRemaining">—</strong></div><div id="holdBox" class="remain"><span class="small">Hold</span><strong id="holdRemaining">—</strong></div><div id="coolBox" class="remain"><span class="small">Cooldown</span><strong id="coolRemaining">—</strong></div><div class="remain"><span class="small">Estimated completion</span><strong id="finishTime">—</strong></div></div></section><section class="card"><canvas id="chart" width="700" height="210"></canvas></section></main><script src="app.js"></script></body></html>
